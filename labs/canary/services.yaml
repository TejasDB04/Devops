apiVersion: v1
kind: Service
metadata:
  name: canary-stable
  namespace: canary
spec:
  selector:
    app: canary-demo
    track: stable
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: canary-new
  namespace: canary
spec:
  selector:
    app: canary-demo
    track: canary
  ports:
  - port: 80
    targetPort: 3000
