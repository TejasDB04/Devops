apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: ingress-nginx

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: ingress-nginx
data:
  # Enable CORS
  enable-cors: "true"
  # Security headers
  add-headers: "ingress-nginx/custom-headers"
  # Logging
  log-format-upstream: '[$time_local] $remote_addr - $remote_user "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time $upstream_response_time'
  # Rate limiting
  limit-conn-status: "429"
  limit-req-status: "429"
  # Proxy settings
  proxy-body-size: "10m"
  proxy-buffer-size: "128k"
  proxy-buffering: "on"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-headers
  namespace: ingress-nginx
data:
  X-Frame-Options: "SAMEORIGIN"
  X-Content-Type-Options: "nosniff"
  X-XSS-Protection: "1; mode=block"
  Referrer-Policy: "no-referrer-when-downgrade"
  Permissions-Policy: "geolocation=(), microphone=(), camera=()"
