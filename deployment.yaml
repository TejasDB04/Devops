apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-app
  labels:
    app: k8s-app
    version: v1
spec:
  replicas: 2  # Run 2 copies of the pod
  selector:
    matchLabels:
      app: k8s-app
  strategy:
    type: RollingUpdate  # Gradually replace old pods with new ones
    rollingUpdate:
      maxSurge: 1        # Max +1 extra pod during update
      maxUnavailable: 1  # Max 1 pod unavailable during update
  template:
    metadata:
      labels:
        app: k8s-app
        version: v1
        tier: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: app
        image: tejasdb052004/kubernates-app:latest  # Docker image from Docker Hub
        imagePullPolicy: Always  # Always pull from Docker Hub
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        
        # Volume mounts for persistent storage
        volumeMounts:
        - name: storage
          mountPath: /data
        
        # Resource limits and requests
        resources:
          requests:
            memory: "64Mi"    # Minimum memory to schedule
            cpu: "100m"       # Minimum CPU to schedule
          limits:
            memory: "128Mi"   # Maximum memory allowed
            cpu: "500m"       # Maximum CPU allowed
        
        # Liveness probe: restart pod if check fails
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Readiness probe: mark pod as ready/not ready
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
      
      # Volumes - attach PersistentVolumeClaim
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: my-pvc