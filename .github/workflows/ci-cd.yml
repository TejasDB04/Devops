name: Build & Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/kubernates-app
  DOCKER_BUILDKIT: 1

jobs:
  # ========================================
  # JOB 1: TESTING
  # ========================================
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run linter
      run: npm run lint --if-present
    
    - name: Run tests
      run: npm test --if-present
  
  # ========================================
  # JOB 2: BUILD & PUSH IMAGE
  # ========================================
  build:
    needs: test
    runs-on: ubuntu-latest
    name: Build & Push Docker Image
    
    permissions:
      contents: read
      packages: write
      id-token: write
    
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
      image-name: ${{ steps.image.outputs.name }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      id: image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
    
    - name: Image digest
      run: echo ${{ steps.docker_build.outputs.digest }}
  
  # ========================================
  # JOB 3: SCAN IMAGE FOR VULNERABILITIES
  # ========================================
  security-scan:
    needs: build
    runs-on: ubuntu-latest
    name: Security Scan
    
    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
  
  # ========================================
  # JOB 4: DEPLOY TO KUBERNETES (Optional)
  # ========================================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Kubernetes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: Configure kubectl context
      run: |
        # Option 1: Use kubeconfig from secrets
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
        
        # Verify connection
        kubectl cluster-info
        kubectl get nodes
    
    - name: Update deployment image
      run: |
        kubectl set image deployment/k8s-app-deployment \
          app=${{ needs.build.outputs.image-name }}:${{ needs.build.outputs.image-tag }} \
          -n default \
          --record
    
    - name: Verify rollout
      run: |
        kubectl rollout status deployment/k8s-app-deployment -n default --timeout=5m
    
    - name: Verify services
      run: |
        kubectl get services -n default
        kubectl get ingress -n default
    
    - name: Check pod status
      run: |
        kubectl get pods -n default
        kubectl logs -n default -l app=k8s-app --tail=20

  # ========================================
  # JOB 5: NOTIFY ON SUCCESS/FAILURE
  # ========================================
  notify:
    needs: [test, build]
    runs-on: ubuntu-latest
    name: Notify Status
    if: always()
    
    steps:
    - name: Check build status
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Pipeline completed successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        else
          echo "❌ Pipeline failed!"
          exit 1
        fi
