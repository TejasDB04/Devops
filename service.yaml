apiVersion: v1
kind: Service
metadata:
  name: k8s-app-service
  labels:
    app: k8s-app
spec:
  type: LoadBalancer  # Expose service externally
  selector:
    app: k8s-app     # Route to pods with label app=k8s-app
  ports:
  - name: http
    port: 80         # External port (what clients connect to)
    targetPort: 3000 # Internal port (where pods listen)
    protocol: TCP
  sessionAffinity: ClientIP  # Sticky sessions (optional)
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

