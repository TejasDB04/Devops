apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  namespace: blue-green
  labels:
    app: my-app
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
      version: blue
  template:
    metadata:
      labels:
        app: my-app
        version: blue
    spec:
      containers:
      - name: app
        image: k8s-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: VERSION
          value: "blue-v1"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
        readinessProbe:
          httpGet:
            path: /api/version
            port: 3000
          initialDelaySeconds: 3
